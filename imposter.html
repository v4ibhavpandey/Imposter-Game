<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imposter</title>
    <link rel="stylesheet" href="imposter.css" />
</head>

<body>
    <button id="start-btn">Start Game</button>
    <div class="playerConfirmation hide">
        <p id="Anmt-para">Enter the number of players</p>
        <input type="number" id="player-count">
        <button id="confirm">Confirm</button>
    </div>
    <div class="low-player hide">
        <p>Select at least 3 or more players</p>
    </div>
    <p id="word-display"></p>
    <button id="reveal-btn" class="hide">Reveal</button>
    <button id="finish-btn" class="hide">Finish</button>


    <script src="imposter.js"></script>
</body>

</html>
